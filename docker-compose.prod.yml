version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio_prod
    restart: always
    env_file:
      - .env
    ports:
      - "8001:8000"
    depends_on:
      - db
      - redis

  db:
    image: postgres:15
    container_name: portfolio_db_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  redis:
    image: redis:6
    container_name: portfolio_redis_prod
    restart: always

volumes:
  postgres_data:
