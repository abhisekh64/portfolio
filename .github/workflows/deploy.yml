name: Deploy Django to EC2 AMI

on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Deploy to EC2 AMI
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.EC2_HOST }}
                  username: ${{ secrets.EC2_USER }}
                  key: ${{ secrets.EC2_SSH_KEY }}
                  script: |
                      APP_DIR="/home/ec2-user/projects/portfolio"
                      GIT_BRANCH="main"
                      GITHUB_REPO="github.com/username/repo.git"
                      GITHUB_PAT="${{ secrets.GITHUB_PAT }}"

                      echo "🚀 Starting deployment on AMI EC2..."

                      cd $APP_DIR && ./.scripts/deploy.sh

                      echo "🔐 Setting Git remote with PAT"
                      git remote set-url origin https://${GITHUB_PAT}@${GITHUB_REPO}

                      echo "⬇️ Pulling latest code"
                      git pull origin $GIT_BRANCH

                      if [ ! -f "requirements.txt" ]; then
                        echo "❌ requirements.txt not found!"
                        exit 1
                      fi

                      echo "🐳 Building Docker images"
                      sudo docker compose build

                      echo "🧹 Stopping old containers"
                      sudo docker compose down

                      echo "🚀 Starting containers"
                      sudo docker compose up -d

                      echo "📦 Running migrations"
                      sudo docker exec portfolio_dev python manage.py migrate --noinput

                      echo "🎨 Collecting static files"
                      sudo docker exec portfolio_dev python manage.py collectstatic --noinput

                      echo "✅ Deployment finished successfully"
